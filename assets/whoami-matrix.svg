  <text x="664" y="320" fill="#79c0ff" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11">MODEL RELIABILITY: <tspan fill="#58a6ff" font-weight="700">VERIFIED (QA PASS)</tspan></text>
