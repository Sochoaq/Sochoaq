<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 390" width="960" height="390" role="img" aria-labelledby="title desc">
  <title id="title">Santiago Alejandro Ochoa Quesada — AI Engineer</title>
  <desc id="desc">AI Engineering terminal card showing Santiago Ochoa's background, Edge AI architecture, deep learning telemetry, and on-device inference.</desc>
  <defs>
    <linearGradient id="ai-border" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#58a6ff"/>
      <stop offset="50%" stop-color="#1f6feb"/>
      <stop offset="100%" stop-color="#0d2847"/>
    </linearGradient>
    <filter id="blue-glow" x="-20%" y="-30%" width="140%" height="160%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="scanlines" width="100" height="4" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="100" y2="0" stroke="#58a6ff" stroke-width="0.3" opacity="0.1"/>
    </pattern>
  </defs>

  <!-- GitHub Native Dark Canvas Seamless Background -->
  <rect width="960" height="390" rx="12" fill="#0d1117"/>
  <rect x="5" y="5" width="950" height="380" rx="10" fill="none" stroke="url(#ai-border)" stroke-width="1.6"/>
  <rect width="960" height="390" rx="12" fill="url(#scanlines)" pointer-events="none"/>

  <!-- Window Header Bar -->
  <circle cx="32" cy="28" r="5" fill="#f85149" opacity="0.85"/>
  <circle cx="48" cy="28" r="5" fill="#d29922" opacity="0.85"/>
  <circle cx="64" cy="28" r="5" fill="#58a6ff" opacity="0.95" filter="url(#blue-glow)"/>
  <text x="88" y="33" fill="#79c0ff" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="600">sochoaq@ai-cluster:~$ ./inference.py  ·  model: physical_ai_50kHz  ·  [OPTIMAL]</text>
  <path d="M16 46H944" stroke="#21262d" stroke-width="1.2"/>

  <!-- Left Panel: AI Engineer Profile -->
  <rect x="22" y="60" width="608" height="308" rx="8" fill="#161b22" stroke="#1f6feb" stroke-width="1.2"/>
  
  <text x="42" y="92" fill="#58a6ff" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" font-weight="700" filter="url(#blue-glow)">❯ whoami --role ai-engineer</text>
  <text x="42" y="120" fill="#f0f6fc" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="700">santiago_alejandro_ochoa</text>
  <text x="286" y="120" fill="#79c0ff" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15">—</text>
  <text x="306" y="120" fill="#a5d6ff" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="600">AI &amp; Edge Intelligence Engineer</text>

  <path d="M42 138H610" stroke="#30363d" stroke-width="1"/>

  <text x="42" y="164" fill="#79c0ff" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">origin:</text>
  <text x="140" y="164" fill="#c9d1d9" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">Universidad Nacional de Colombia (UNAL)  🇨🇴</text>

  <text x="42" y="190" fill="#79c0ff" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">focus:</text>
  <text x="140" y="190" fill="#e6edf3" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">Deep Learning, Physical AI, Edge TinyML &amp; Real-Time DSP</text>

  <text x="42" y="216" fill="#79c0ff" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">axiom:</text>
  <text x="140" y="216" fill="#a5d6ff" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-style="italic">"From physical raw telemetry to robust deep learning inference."</text>

  <text x="42" y="254" fill="#58a6ff" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="700" filter="url(#blue-glow)">❯ ls --classified ai_architecture/</text>
  
  <text x="42" y="284" fill="#79c0ff" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="600">deep_learning/</text>
  <text x="195" y="284" fill="#e6edf3" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">PyTorch · TensorFlow · Time-Series Transformers · SciPy DSP</text>

  <text x="42" y="310" fill="#79c0ff" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="600">edge_tinyml/</text>
  <text x="195" y="310" fill="#e6edf3" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">ESP32-S3 Vector AI · On-Device Inference · C/C++ · RTOS</text>

  <text x="42" y="336" fill="#79c0ff" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="600">mlops_cloud/</text>
  <text x="195" y="336" fill="#e6edf3" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">Docker · GitHub Actions CI/CD · AWS Cloud AI · Pytest · APIs</text>

  <!-- Right Panel: AI Neural Signal Inference -->
  <rect x="646" y="60" width="292" height="308" rx="8" fill="#161b22" stroke="#1f6feb" stroke-width="1.2"/>
  <text x="664" y="92" fill="#58a6ff" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="700" filter="url(#blue-glow)">$ run_inference --model dps_net</text>
  <text x="664" y="112" fill="#79c0ff" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11">50 kHz SPECTRAL DSP + RESIDUAL AI</text>

  <!-- AI Inference Wave Grid -->
  <rect x="662" y="124" width="260" height="152" fill="#0d1117" stroke="#21262d" stroke-width="1"/>
  <line x1="662" y1="200" x2="922" y2="200" stroke="#172d47" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="792" y1="124" x2="792" y2="276" stroke="#172d47" stroke-width="1" stroke-dasharray="3 3"/>

  <!-- AI Latent Embedding Tokens -->
  <g opacity="0.38" font-family="ui-monospace, monospace" font-size="9" fill="#58a6ff">
    <text x="670" y="142">LATENT_DIM: 128</text>
    <text x="670" y="156">FFT_H1: 1.000</text>
    <text x="670" y="170">FFT_H3: 0.084</text>
    <text x="840" y="142">LOSS: 0.0012</text>
    <text x="840" y="156">F1: 99.4%</text>
    <text x="840" y="170">VAL_ACC: 0.98</text>
  </g>

  <!-- AI Feature Waveform -->
  <path d="M 662 200 Q 682 142, 702 174 T 742 226 T 782 150 T 822 236 T 862 162 T 902 216 T 922 200" 
        fill="none" stroke="#58a6ff" stroke-width="2.4" filter="url(#blue-glow)"/>
  <path d="M 662 200 Q 682 142, 702 174 T 742 226 T 782 150 T 822 236 T 862 162 T 902 216 T 922 200" 
        fill="none" stroke="#a5d6ff" stroke-width="1"/>

  <!-- AI Inference Metrics -->
  <text x="664" y="298" fill="#79c0ff" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11">INFERENCE LATENCY: <tspan fill="#58a6ff" font-weight="700">2.4 ms [EDGE]</tspan></text>
  <text x="664" y="320" fill="#79c0ff" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11">DEGRADATION PREDICTION: <tspan fill="#58a6ff" font-weight="700">HEALTHY (HI 98.4%)</tspan></text>
  <text x="664" y="342" fill="#38bdf8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11">> model status: online // validated</text>
</svg>
