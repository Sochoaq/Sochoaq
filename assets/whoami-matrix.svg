<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 410" width="960" height="410" role="img" aria-labelledby="title desc">
  <title id="title">Santiago Alejandro Ochoa Quesada — Project Engineer | AI Engineering</title>
  <desc id="desc">Project Engineer terminal card showcasing Santiago Ochoa's background, AI project leadership, system architecture, and end-to-end delivery.</desc>
  <defs>
    <linearGradient id="ai-border" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#58a6ff"/>
      <stop offset="50%" stop-color="#1f6feb"/>
      <stop offset="100%" stop-color="#0d2847"/>
    </linearGradient>
    <filter id="blue-glow" x="-20%" y="-30%" width="140%" height="160%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="scanlines" width="100" height="4" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="100" y2="0" stroke="#58a6ff" stroke-width="0.3" opacity="0.1"/>
    </pattern>
  </defs>

  <!-- GitHub Native Dark Canvas Seamless Background -->
  <rect width="960" height="410" rx="12" fill="#0d1117"/>
  <rect x="5" y="5" width="950" height="400" rx="10" fill="none" stroke="url(#ai-border)" stroke-width="1.6"/>
  <rect width="960" height="410" rx="12" fill="url(#scanlines)" pointer-events="none"/>

